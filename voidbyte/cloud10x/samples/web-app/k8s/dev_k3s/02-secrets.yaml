# Dev-only placeholders. Real values come from an external secret manager
# (External Secrets, Vault, Sealed Secrets, SOPS) and never enter git.
# Replace REPLACE_ME locally (e.g. via gen-key output) before applying.
apiVersion: v1
kind: Secret
metadata:
  name: rust10x-auth-secret
  namespace: rust10x-web-app
type: Opaque
immutable: true
stringData:
  SERVICE_TOKEN_KEY: REPLACE_ME
  SERVICE_PWD_KEY: REPLACE_ME
---
# App connection string. Mounted into web-server and db-mgmt.
apiVersion: v1
kind: Secret
metadata:
  name: rust10x-db-secret
  namespace: rust10x-web-app
type: Opaque
immutable: true
stringData:
  SERVICE_DB_URL: postgres://app_user:REPLACE_ME@rust10x-db:5432/app_db
---
# Admin connection string. Mounted into the db-mgmt Job ONLY.
apiVersion: v1
kind: Secret
metadata:
  name: rust10x-db-admin-secret
  namespace: rust10x-web-app
type: Opaque
immutable: true
stringData:
  SERVICE_PG_ROOT_URL: postgres://postgres:REPLACE_ME@rust10x-db:5432/postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: rust10x-postgres-secret
  namespace: rust10x-web-app
type: Opaque
immutable: true
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
