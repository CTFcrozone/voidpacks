# Default deny, then explicit allows. Policies are additive.
# Every connection needs BOTH halves: client egress + server ingress.
# Ports are POD (target) ports, not Service ports. Not run-tested on a cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: rust10x-web-app
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: rust10x-web-app
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Ingress controller (Traefik in k3s lives in kube-system) -> web-server pod port 8081.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-server-allow-ingress-controller
  namespace: rust10x-web-app
spec:
  podSelector:
    matchLabels:
      app: rust10x-web-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: TCP, port: 8081 }
---
# web-server egress -> PostgreSQL and Valkey.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-server-allow-egress
  namespace: rust10x-web-app
spec:
  podSelector:
    matchLabels:
      app: rust10x-web-server
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rust10x-db
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels:
              app: rust10x-valkey
      ports:
        - { protocol: TCP, port: 6379 }
---
# db-mgmt egress -> PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-mgmt-allow-egress
  namespace: rust10x-web-app
spec:
  podSelector:
    matchLabels:
      app: rust10x-db-mgmt
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: rust10x-db
      ports:
        - { protocol: TCP, port: 5432 }
---
# PostgreSQL ingress <- web-server, db-mgmt.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-ingress
  namespace: rust10x-web-app
spec:
  podSelector:
    matchLabels:
      app: rust10x-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rust10x-web-server
        - podSelector:
            matchLabels:
              app: rust10x-db-mgmt
      ports:
        - { protocol: TCP, port: 5432 }
---
# Valkey ingress <- web-server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-allow-ingress
  namespace: rust10x-web-app
spec:
  podSelector:
    matchLabels:
      app: rust10x-valkey
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rust10x-web-server
      ports:
        - { protocol: TCP, port: 6379 }
