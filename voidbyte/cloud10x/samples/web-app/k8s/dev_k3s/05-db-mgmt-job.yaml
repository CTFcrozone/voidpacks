apiVersion: batch/v1
kind: Job
metadata:
  name: rust10x-db-mgmt
  namespace: rust10x-web-app
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: rust10x-db-mgmt
        run: "{{system}}-db-mgmt"
    spec:
      serviceAccountName: rust10x-db-mgmt
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-mgmt
          image: "{{registry}}/{{system}}-db-mgmt:{{image_tag}}"
          envFrom:
            - configMapRef:
                name: rust10x-config
            - secretRef:
                name: rust10x-auth-secret
            - secretRef:
                name: rust10x-db-secret
            - secretRef:
                name: rust10x-db-admin-secret
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
