apiVersion: v1
kind: Service
metadata:
  name: rust10x-queue
  labels:
    app: rust10x-queue
spec:
  selector:
    app: rust10x-queue
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust10x-queue
  labels:
    app: rust10x-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust10x-queue
  template:
    metadata:
      labels:
        app: rust10x-queue
        run: "{{system}}-queue"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: "{{registry}}/rust10x-queue:{{image_tag}}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}      # ephemeral: a restart empties the queues. Use a PVC + AOF to persist.
