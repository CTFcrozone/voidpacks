# External entry for the web server. LoadBalancer is dev-only (use `minikube tunnel`).
apiVersion: v1
kind: Service
metadata:
  name: rust10x-web-server
  labels:
    app: rust10x-web-server
spec:
  type: LoadBalancer
  selector:
    app: rust10x-web-server
  ports:
    - name: web
      port: {{web_external_ports}}     # realm variable (kdd.yaml realms._base_)
      targetPort: 8081
      protocol: TCP
