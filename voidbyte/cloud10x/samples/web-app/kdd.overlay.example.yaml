# Example overlay with staging and production realms. All values are placeholders.
# Copy to kdd.local.yaml (git-ignored) or to <env>/kdd-<env>.yaml (committed) and fill in.
# List it in the FIRST document of kdd.yaml, top level (not under vars):
#   overlays:
#     - prod/kdd-prod.yaml
# Overlay realms replace same-name realms; realms._base_ of kdd.yaml applies to them.
# Only `realms:` is read from an overlay. Paths such as yaml_dir stay relative to the kdd root.
# Never commit real account IDs, ARNs or registry hostnames in a public repo.
realms:
  staging:
    yaml_dir: k8s/staging/
    context: <staging-kubectl-context>        # unique per realm
    registry: <registry-host>                 # no trailing slash
    confirm_delete: true
    replicas: 2
    ingress_host: <staging-host>

  prod:
    yaml_dir: k8s/prod/
    context: <prod-kubectl-context>
    registry: <registry-host>
    profile: <cloud-cli-profile>              # AWS profile; use `project:` for GCP
    confirm_delete: true                      # never false outside throwaway clusters
    replicas: 3
    ingress_host: <prod-host>
