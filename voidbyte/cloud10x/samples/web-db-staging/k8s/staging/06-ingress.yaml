apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rust10x-web-server
  namespace: rust10x-web-app
  annotations:
    cert-manager.io/cluster-issuer: "{{cert_issuer}}"
spec:
  tls:
    - hosts: ["{{ingress_host}}"]
      secretName: rust10x-web-server-tls
  rules:
    - host: "{{ingress_host}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rust10x-web-server
                port:
                  number: 80
