# Dev-only placeholders. Real values come from an external secret manager
# (External Secrets, Vault, Sealed Secrets, SOPS) and never enter git.
# The passwords must agree: POSTGRES_PASSWORD = the password in SERVICE_PG_ROOT_URL,
# SERVICE_DB_APP_PASSWORD = the password in SERVICE_DB_URL.
# Superuser password. Mounted into the Postgres pod ONLY.
apiVersion: v1
kind: Secret
metadata:
  name: rust10x-postgres-secret
  namespace: rust10x-web-app
type: Opaque
immutable: true
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
---
# Admin connection and the app user's password. Mounted into the db-mgmt Job ONLY.
apiVersion: v1
kind: Secret
metadata:
  name: rust10x-db-admin-secret
  namespace: rust10x-web-app
type: Opaque
immutable: true
stringData:
  SERVICE_PG_ROOT_URL: postgres://postgres:REPLACE_ME@rust10x-db:5432/postgres
  SERVICE_DB_APP_PASSWORD: REPLACE_ME
---
# App connection string (least privilege). Mounted into the web-server ONLY.
apiVersion: v1
kind: Secret
metadata:
  name: rust10x-db-secret
  namespace: rust10x-web-app
type: Opaque
immutable: true
stringData:
  SERVICE_DB_URL: postgres://app_user:REPLACE_ME@rust10x-db:5432/app_db
