[package]
name = "web-server"
# literal version on purpose: kdd reads this file (see contract.md)
version = "0.1.0"
edition.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
