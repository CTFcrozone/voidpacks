# Example CI for a cloud10x project. Copy to .github/workflows/ci.yml.
# Placeholders: set repository variables REGISTRY, SYSTEM, REALM, KUBE_CONTEXT.
# Pin every third-party action to a full commit SHA in production (tags shown for readability).
# Applying to a cluster is NOT done here; production is applied by an approved pipeline or a human (environments.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}          # registry host, no trailing slash
  SYSTEM: ${{ vars.SYSTEM }}              # same value as `system:` in kdd.yaml
  REALM: ${{ vars.REALM }}                # realm checked in CI, e.g. dev_k3d
  KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT }}  # context of that realm, e.g. k3d-<cluster>

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable        # latest stable; use rust-toolchain.toml to pin
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: EmbarkStudios/cargo-deny-action@v2   # licenses, advisories, bans (needs deny.toml)

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kdd, kubeconform
        run: |
          cargo install kdd --locked        # or install your internal kdd build
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
          sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Fake kube context (render only, no cluster)
        run: |
          kubectl config set-cluster ci --server=https://127.0.0.1:6443
          kubectl config set-context "$KUBE_CONTEXT" --cluster=ci
          kubectl config use-context "$KUBE_CONTEXT"
      - name: Consistency and hardening gate
        run: ./check.sh "$REALM"          # runs lint.py on the rendered manifests
      - name: Schema validation
        run: kubeconform -strict -summary -ignore-missing-schemas k8s/*/.out/"$REALM"

  images:
    needs: [rust, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                      # keyless signing and registry OIDC
    strategy:
      matrix:
        service: [web-server, db-mgmt]     # one entry per block
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/services/web-server/Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Registry login                # replace with your registry's OIDC login action
        if: github.ref == 'refs/heads/main'
        run: echo "login to $REGISTRY with OIDC (provider specific)"
      - name: Build (push on main only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/services/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.SYSTEM }}-${{ matrix.service }}:${{ steps.v.outputs.version }}
      - name: Scan image (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master        # pin to a release SHA
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.SYSTEM }}-${{ matrix.service }}:${{ steps.v.outputs.version }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.SYSTEM }}-${{ matrix.service }}:${{ steps.v.outputs.version }}
          artifact-name: sbom-${{ matrix.service }}.spdx.json
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main'
      - name: Sign by digest
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "$REGISTRY/$SYSTEM-${{ matrix.service }}@${{ steps.build.outputs.digest }}"
      - name: Record digest
        if: github.ref == 'refs/heads/main'
        run: echo '${{ steps.build.outputs.digest }}' > digest-${{ matrix.service }}.txt
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: digest-${{ matrix.service }}
          path: digest-${{ matrix.service }}.txt

  release:
    if: github.ref == 'refs/heads/main'
    needs: [images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Assemble release.json (input for the production render)
        run: |
          python3 - <<'PY'
          import glob, json, os
          out = {os.path.basename(f)[7:-4].replace('-', '_') + '_digest': open(f).read().strip() for f in glob.glob('digest-*.txt')}
          json.dump(out, open('release.json', 'w'), indent=2)
          PY
          cat release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.json
